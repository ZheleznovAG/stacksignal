name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Check public source for credentials and tracked runtime data
        run: python scripts/public_release.py --check
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Install (versions pinned by backend/constraints.txt)
        run: python stacksignal.py setup --dev
      - name: Test (no network, in-memory SQLite, AI disabled)
        run: python stacksignal.py test

  e2e:
    # The dashboard in a real browser against the real server on a scratch database (backend/e2e/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Install
        run: |
          python stacksignal.py setup --browser
          python stacksignal.py exec -- -m playwright install-deps chromium
      - name: Browser smoke tests
        run: python stacksignal.py test --browser
