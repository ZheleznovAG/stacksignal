name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Check public source for credentials and tracked runtime data
        run: python scripts/public_release.py --check
      - name: Install (versions pinned by backend/constraints.txt)
        run: pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      - name: Test (no network, in-memory SQLite, AI disabled)
        working-directory: backend
        run: python -m pytest -q

  e2e:
    # The dashboard in a real browser against the real server on a scratch database (backend/e2e/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Install
        run: |
          pip install -r backend/requirements-e2e.txt -c backend/constraints.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: backend
        run: python -m pytest e2e -q
